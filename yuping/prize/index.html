<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuping 景品收藏圖鑑</title>
<link rel="stylesheet" href="../../assets/catalog-viewer.css?v=20261028">
<script src="../../assets/catalog-viewer.js?v=20261028"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --dim:#9aa3b2; --accent:#ff4f8b; --accent2:#7cf2ff;
    --ok:#3ecf8e; --warn:#e0a53a;
  }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
  <h1>Yuping <span class="r">景品</span> 收藏<span class="y">圖鑑</span></h1>
  <button class="tgl" id="tgl" type="button">篩選 / 搜尋 ▾</button>
  </div>
  <div class="views" id="views"><span class="vl">檢視</span><button type="button" class="vchip on" data-v="thumb" aria-pressed="true">縮圖</button><button type="button" class="vchip" data-v="photo" aria-pressed="false">照片</button></div>
  <div class="panel">
  <div><a class="back" href="../../">← 回 Guide 首頁</a><a class="back" href="../">Yuping 的收藏</a><a class="back" href="../plush/">娃娃收藏(待確認)</a></div>
  <div class="sub" id="sub">載入中…</div>
  <div class="search">
    <input id="q" placeholder="搜尋:角色 / 作品 / 廠商 / 系列(如 初音、ぼっち、SEGA、一番くじ)" autocomplete="off">
  </div>
  <div class="modes" id="modes"></div>
  <div class="chips" id="chips"></div>
  </div>
</div></header>
<div class="count" id="count"></div>
<div id="grid"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="詳細資料">
  <div class="box">
    <button class="close" id="close" type="button" aria-label="關閉">×</button>
    <div id="mimg"></div>
    <div class="body" id="mbody"></div>
  </div>
</div>

<script>
// 共用檢視器:../../assets/catalog-viewer.js(行為改那裡,四頁一起生效)
(function(){
const esc=CatalogViewer.esc;
const TYPE_LABEL={figure:'公仔 / 模型',plush:'玩偶',other:'其他'};
const CONF_LABEL={low:'待確認',medium:'信心中',med:'信心中',high:'信心高'};
const nameOf=c=>c.name_zh||c.name_en||c.name_ja||c.id;
CatalogViewer.init({
  json:'items.json',
  parse:d=>({items:d.items||[],build:d.build||''}),
  emptyIcon:'🎁',
  photoLabel:p=>p.startsWith('raw/')?['我拍的','mine']:p.startsWith('box/')?['官方圖','']:['',''],
  thumb:{
    badges:c=>c.confidence==='low'?`<span class="lc">待確認</span>`:'',
    meta:c=>{const sub=[c.maker,c.line].filter(Boolean).join(' · ');
      return `<div class="nm">${esc(nameOf(c))}</div>
    <div class="nsub" title="${esc(sub)}">${esc(sub)}</div>
    ${c.year?`<div class="yr">${esc(c.year)}</div>`:''}`;}
  },
  photo:{
    code:c=>c.code||'',
    conf:c=>c.confidence?[c.confidence,CONF_LABEL[c.confidence]||c.confidence]:null,
    pills:c=>[c.ip,c.maker,c.year]
  },
  detail:c=>{
    const rows=[['中文名',c.name_zh],['英文名',c.name_en],['日文名',c.name_ja],['作品',c.ip],['角色',c.character],
      ['廠商',c.maker],['系列',c.line],['類型',TYPE_LABEL[c.type]||c.type],['年份',c.year],
      ['分類',(c.category||[]).join('、')]].filter(r=>r[1]);
    const kv=rows.map(r=>`<b>${r[0]}</b><div>${esc(r[1])}</div>`).join('');
    const tags=(c.keywords||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('');
    const note=[c.confidence==='low'?'⚠️ 辨識信心低,待確認':'',c.notes?('📝 '+esc(c.notes)):''].filter(Boolean).join('<br>');
    return `<h2>${esc(c.name_zh||c.name_en||c.id)}</h2><div class="kv">${kv}</div>
    <div class="tags">${tags}</div>${note?`<div class="note">${note}</div>`:''}`;
  },
  search:c=>[c.name_zh,c.name_en,c.name_ja,c.ip,c.character,c.maker,c.line,c.id,c.category,c.keywords],
  chips:{values:c=>c.category,top:14},
  modes:[
    {id:'ip',label:'依作品',key:c=>c.ip||'其他'},
    {id:'maker',label:'依廠商',key:c=>c.maker||'其他'},
    {id:'type',label:'依類型',key:c=>TYPE_LABEL[c.type]||'其他'}
  ],
  summary:(d,items)=>{const withImg=items.filter(c=>c.main_image).length,low=items.filter(c=>c.confidence==='low').length;
    return `${items.length} 件 · ${withImg} 有官方圖${low?` · ${low} 待確認`:''} · 更新 ${d.updated||''}`;},
  loadError:'items.json 載入失敗:'
});
})();
</script>
</body>
</html>
