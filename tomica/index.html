<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomica 收藏圖鑑</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --dim:#9aa3b2; --accent:#e60012; --accent2:#ffd400;
    --ok:#3ecf8e; --warn:#e0a53a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.95);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  h1 .r{color:var(--accent)} h1 .y{color:var(--accent2)}
  .sub{color:var(--dim);font-size:12px;margin-top:2px}
  .search{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  #q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:11px 14px;font-size:15px;outline:none}
  #q:focus{border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .modes{display:flex;gap:6px;margin-top:10px}
  .mchip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;user-select:none;font-weight:600}
  .mchip.on{background:var(--accent2);border-color:var(--accent2);color:#000}
  .count{color:var(--dim);font-size:12px;margin:14px 16px 0}
  #grid{padding-bottom:40px}
  .gsec{max-width:1100px;margin:0 auto}
  .ghdr{display:flex;align-items:center;gap:8px;margin:22px 16px 4px;
    font-size:15px;font-weight:700;color:var(--txt);border-left:3px solid var(--accent);padding-left:10px}
  .ghdr span{font-size:11px;font-weight:500;color:var(--dim);
    background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .grid{margin:8px auto 8px;padding:0 12px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .thumb{aspect-ratio:1/1;background:#0b0d11 center/contain no-repeat;
    display:flex;align-items:center;justify-content:center}
  .thumb.none{color:#404757;font-size:34px}
  .badges{position:absolute;margin:6px;display:flex;gap:4px}
  .cardhead{position:relative}
  .num{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
  .lc{position:absolute;top:6px;right:6px;background:var(--warn);color:#000;
    font-size:10px;padding:2px 6px;border-radius:6px}
  .own{position:absolute;bottom:6px;left:6px;background:var(--accent2);color:#000;
    font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
  .meta{padding:8px 10px}
  .nm{font-size:13px;line-height:1.35;font-weight:600}
  .nsub{font-size:11px;color:var(--dim);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yr{font-size:11px;color:var(--accent2);margin-top:4px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
    display:none;align-items:center;justify-content:center;padding:16px}
  .modal.on{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    max-width:620px;width:100%;max-height:90vh;overflow:auto}
  .box img{width:100%;background:#0b0d11;display:block;max-height:52vh;object-fit:contain}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#0b0d11;border-top:1px solid var(--line)}
  .pth{position:relative;flex:0 0 auto;width:64px;height:64px;border:2px solid transparent;
    border-radius:8px;overflow:hidden;cursor:pointer;background:#000}
  .pth.on{border-color:var(--accent)}
  .pth img{width:100%;height:100%;object-fit:cover;max-height:none}
  .pth span{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;
    background:rgba(0,0,0,.7);color:#fff;padding:1px 0}
  .pth.mine span{background:var(--accent2);color:#000}
  .onelbl{font-size:11px;color:var(--dim);padding:6px 12px 0}
  .box .body{padding:16px}
  .box h2{margin:0 0 4px;font-size:19px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:12px;font-size:13px}
  .kv b{color:var(--dim);font-weight:500}
  .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:2px 8px;font-size:11px;color:var(--dim)}
  .close{position:sticky;top:8px;float:right;margin:8px;background:#000a;border:0;
    color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
  .note{margin-top:10px;font-size:12px;color:var(--warn);line-height:1.5}
  a{color:var(--accent2)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1><span class="r">TOMICA</span> 收藏<span class="y">圖鑑</span></h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="search">
    <input id="q" placeholder="搜尋:番號 / 車名 / 品牌 / 關鍵字(如 136、消防、Pikachu、UD)" autocomplete="off">
  </div>
  <div class="modes" id="modes">
    <span class="mchip on" data-m="ip">依 IP 分類</span>
    <span class="mchip" data-m="size">依大小分類</span>
  </div>
  <div class="chips" id="chips"></div>
</div></header>
<div class="count" id="count"></div>
<div id="grid"></div>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" id="close">×</button>
    <div id="mimg"></div>
    <div class="body" id="mbody"></div>
  </div>
</div>

<script>
let CARS=[], FILTER=null, GROUP_ORDER=[], IP_RANK={}, MODE='ip';
const $=s=>document.querySelector(s), grid=$('#grid');

function imgHtml(c,cls){
  if(c.main_image) return `<div class="thumb ${cls||''}" style="background-image:url('images/${c.main_image}')"></div>`;
  return `<div class="thumb none ${cls||''}">🚗</div>`;
}
function card(c){
  const num=c.number?`<span class="num">No.${c.number}</span>`:'';
  const lc=c.confidence==='low'?`<span class="lc">待確認</span>`:'';
  const name=c.name_zh||c.name_en||c.name_ja||c.id;
  const sub=[c.name_en,c.series].filter(Boolean).join(' · ');
  return `<div class="card" data-id="${c.id}">
    <div class="cardhead">${imgHtml(c)}${num}${lc}${c.main_image&&c.main_image.startsWith('raw/')?'<span class="own">📷自拍</span>':''}</div>
    <div class="meta"><div class="nm">${name}</div>
    <div class="nsub">${sub||'&nbsp;'}</div>
    ${c.year?`<div class="yr">${c.year}</div>`:''}</div></div>`;
}
const SIZE_ORDER=['標準','長型','口袋','其他'];
const SIZE_LABEL={'標準':'標準版','長型':'長型 (Long Type)','口袋':'口袋 (Pocket)','其他':'其他'};
function GKEY(c){
  if(c.kind) return '__ACC';
  return MODE==='size' ? (c.size||'其他') : (c.ip||'');
}
function orderFor(){ return MODE==='size' ? SIZE_ORDER.concat(['','__ACC']) : GROUP_ORDER; }
function render(list){
  const groups={};
  list.forEach(c=>{const k=GKEY(c);(groups[k]=groups[k]||[]).push(c)});
  Object.values(groups).forEach(arr=>arr.sort((a,b)=>{
    if(MODE==='size'){const ia=IP_RANK[a.ip||'']??999,ib=IP_RANK[b.ip||'']??999;if(ia!==ib)return ia-ib;}
    const sa=a.seq??9999,sb=b.seq??9999;if(sa!==sb)return sa-sb;
    const ua=a.sub||'~',ub=b.sub||'~';if(ua!==ub)return ua.localeCompare(ub);
    const na=a.number?String(a.number):'~~', nb=b.number?String(b.number):'~~';
    return na.localeCompare(nb,'en',{numeric:true});
  }));
  const order=orderFor().filter(k=>groups[k]&&groups[k].length);
  grid.innerHTML=order.map(k=>{
    const label=k==='__ACC'?'🏠 車庫・場景・套組(非單一車輛)'
      :MODE==='size'?(SIZE_LABEL[k]||k):(k||'一般車輛 / 其他');
    return `<div class="gsec"><div class="ghdr">${label}<span>${groups[k].length}</span></div>
      <div class="grid">${groups[k].map(card).join('')}</div></div>`;
  }).join('');
  const nCar=CARS.filter(c=>!c.kind).length;
  $('#count').textContent=`顯示 ${list.length} 筆 · 收藏共 ${nCar} 台車`;
}
function match(c,q){
  if(!q) return true;
  const hay=[c.number,c.name_zh,c.name_en,c.name_ja,c.series,c.id,c.ip,
    (c.category||[]).join(' '),(c.keywords||[]).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
}
function apply(){
  const q=$('#q').value.trim();
  let list=CARS.filter(c=>match(c,q));
  if(FILTER) list=list.filter(c=>(c.category||[]).includes(FILTER));
  render(list);
}
function photoList(c){
  let ps=(c.photos&&c.photos.length)?c.photos.slice():[];
  if(!ps.length && c.main_image) ps=[c.main_image];
  return ps;
}
function plabel(p){
  if(p.startsWith('box/'))return['盒裝',''];
  if(p.startsWith('loose/'))return['裸車',''];
  if(p.startsWith('raw/'))return['我拍的','mine'];
  return['',''];
}
function galleryHtml(c){
  const ps=photoList(c);
  if(!ps.length) return `<div class="thumb none" style="aspect-ratio:16/9">🚗 無圖片</div>`;
  const main=`<img id="mainphoto" src="images/${ps[0]}">`;
  if(ps.length===1){const[l]=plabel(ps[0]);return main+(l?`<div class="onelbl">${l}</div>`:'');}
  const strip=`<div class="strip">`+ps.map((p,i)=>{const[l,cl]=plabel(p);
    return `<div class="pth ${cl}${i===0?' on':''}" data-src="images/${p}"><img src="images/${p}">${l?`<span>${l}</span>`:''}</div>`;}).join('')+`</div>`;
  return main+strip;
}
function openCard(id){
  const c=CARS.find(x=>x.id===id); if(!c) return;
  $('#mimg').innerHTML = galleryHtml(c);
  const rows=[['番號',c.number],['中文名',c.name_zh],['英文名',c.name_en],
    ['日文名',c.name_ja],['年份',c.year],['系列',c.series],
    ['分類',(c.category||[]).join('、')]].filter(r=>r[1]);
  const kv=rows.map(r=>`<b>${r[0]}</b><span>${r[1]}</span>`).join('');
  const tags=(c.keywords||[]).map(k=>`<span class="tag">${k}</span>`).join('');
  const note=[c.confidence==='low'?'⚠ 此筆資料信心較低,可能需人工確認。':'',
    c.notes?('📝 '+c.notes):''].filter(Boolean).join('<br>');
  $('#mbody').innerHTML=`<h2>${c.name_zh||c.name_en||c.id}</h2>
    <div class="kv">${kv}</div>${tags?`<div class="tags">${tags}</div>`:''}
    ${note?`<div class="note">${note}</div>`:''}`;
  $('#modal').classList.add('on');
}
grid.addEventListener('click',e=>{const k=e.target.closest('.card');if(k)openCard(k.dataset.id)});
$('#mimg').addEventListener('click',e=>{const t=e.target.closest('.pth');if(!t)return;
  document.getElementById('mainphoto').src=t.dataset.src;
  $('#mimg').querySelectorAll('.pth').forEach(x=>x.classList.remove('on'));t.classList.add('on');});
$('#close').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#q').addEventListener('input',apply);

fetch('cars.json').then(r=>r.json()).then(d=>{
  CARS=d.cars;
  const nCar=CARS.filter(c=>!c.kind).length;
  const withImg=CARS.filter(c=>c.main_image).length;
  const sz={};CARS.forEach(c=>{if(c.kind)return;sz[c.size]=(sz[c.size]||0)+1});
  const szTxt=['標準','長型','口袋'].filter(k=>sz[k]).map(k=>`${k} ${sz[k]}`).join(' / ');
  $('#sub').textContent=`收藏 ${nCar} 台車(${szTxt})· ${withImg} 筆有圖 · 更新 ${d.updated}`;
  // group order: franchises by size desc, then general, accessories last
  const gc={};CARS.forEach(c=>{const k=GKEY(c);gc[k]=(gc[k]||0)+1});
  GROUP_ORDER=Object.keys(gc).filter(k=>k&&k!=='__ACC').sort((a,b)=>gc[b]-gc[a]);
  GROUP_ORDER.push('');if(gc['__ACC'])GROUP_ORDER.push('__ACC');
  IP_RANK={};GROUP_ORDER.forEach((k,i)=>IP_RANK[k]=i);
  $('#modes').addEventListener('click',e=>{const m=e.target.closest('.mchip');if(!m)return;
    MODE=m.dataset.m;document.querySelectorAll('.mchip').forEach(x=>x.classList.toggle('on',x===m));apply();});
  // category chips (top ones)
  const cnt={};CARS.forEach(c=>(c.category||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1));
  const cats=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,14);
  $('#chips').innerHTML=`<span class="chip on" data-c="">全部</span>`+
    cats.map(([k,n])=>`<span class="chip" data-c="${k}">${k} ${n}</span>`).join('');
  $('#chips').addEventListener('click',e=>{
    const ch=e.target.closest('.chip');if(!ch)return;
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    ch.classList.add('on');FILTER=ch.dataset.c||null;apply();
  });
  apply();
}).catch(e=>{$('#sub').textContent='載入 cars.json 失敗:'+e});
</script>
</body>
</html>
