<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomica 收藏圖鑑</title>
<link rel="stylesheet" href="../assets/catalog-viewer.css?v=20261028b">
<script src="../assets/catalog-viewer.js?v=20261028b"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --dim:#9aa3b2; --accent:#e60012; --accent2:#ffd400;
    --ok:#3ecf8e; --warn:#e0a53a;
  }
</style>
</head>
<body>
<header><div class="wrap">
  <nav class="crumbs"><a class="back" href="../">← 回 Guide 首頁</a></nav>
  <div class="hrow">
  <h1><span class="r">TOMICA</span> 收藏<span class="y">圖鑑</span></h1>
  <button class="tgl" id="tgl" type="button">篩選 / 搜尋 ▾</button>
  </div>
  <div class="views" id="views"><span class="vl">檢視</span><button type="button" class="vchip on" data-v="thumb" aria-pressed="true">縮圖</button><button type="button" class="vchip" data-v="photo" aria-pressed="false">照片</button></div>
  <div class="panel">
  <div class="sub" id="sub">載入中…</div>
  <div class="search">
    <input id="q" placeholder="搜尋:番號 / 車名 / 品牌 / 關鍵字(如 136、消防、Pikachu、UD)" autocomplete="off">
  </div>
  <div class="modes" id="modes"></div>
  <div class="chips" id="chips"></div>
  </div>
</div></header>
<div class="count" id="count"></div>
<div id="grid"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="詳細資料">
  <div class="box">
    <button class="close" id="close" type="button" aria-label="關閉">×</button>
    <div id="mimg"></div>
    <div class="body" id="mbody"></div>
  </div>
</div>

<script>
// 共用檢視器:../assets/catalog-viewer.js(行為改那裡,四頁一起生效)
(function(){
const esc=CatalogViewer.esc;
const CONF_LABEL={low:'待確認',medium:'信心中',med:'信心中',high:'信心高'};
const SIZE_ORDER=['標準','長型','口袋','其他'];
const SIZE_LABEL={'標準':'標準版','長型':'長型 (Long Type)','口袋':'口袋 (Pocket)','其他':'其他'};
let GROUP_ORDER=[], IP_RANK={};
const ACC=c=>!!c.kind;   // 車庫・場景・套組(非單一車輛)另成一組
const byNum=(a,b)=>{
  const sa=a.seq??9999,sb=b.seq??9999;if(sa!==sb)return sa-sb;
  const ua=a.sub||'~',ub=b.sub||'~';if(ua!==ub)return ua.localeCompare(ub);
  const na=a.number?String(a.number):'~~', nb=b.number?String(b.number):'~~';
  return na.localeCompare(nb,'en',{numeric:true});
};
const groupLabel=k=>k==='__ACC'?'🏠 車庫・場景・套組(非單一車輛)':k;
CatalogViewer.init({
  json:'cars.json',
  parse:d=>({items:d.cars||[],build:d.build||d.updated||''}),
  emptyIcon:'🚗',
  photoLabel:p=>p.startsWith('box/')?['盒裝','']:p.startsWith('loose/')?['裸車','']:p.startsWith('raw/')?['我拍的','mine']:['',''],
  thumb:{
    badges:c=>(c.number?`<span class="num">No.${esc(c.number)}</span>`:'')+(c.confidence==='low'?`<span class="lc">待確認</span>`:'')+
      (c.main_image&&c.main_image.startsWith('raw/')?'<span class="own">📷自拍</span>':''),
    meta:c=>{const sub=[c.name_en,c.series].filter(Boolean).join(' · ');
      return `<div class="nm">${esc(c.name_zh||c.name_en||c.name_ja||c.id)}</div>
    <div class="nsub">${sub?esc(sub):'&nbsp;'}</div>
    ${c.year?`<div class="yr">${esc(c.year)}</div>`:''}`;}
  },
  photo:{
    code:c=>c.number?'No.'+c.number:'',
    conf:c=>c.confidence?[c.confidence,CONF_LABEL[c.confidence]||c.confidence]:null,
    pills:c=>[c.ip,c.series,c.year]
  },
  detail:c=>{
    const rows=[['番號',c.number],['中文名',c.name_zh],['英文名',c.name_en],
      ['日文名',c.name_ja],['年份',c.year],['系列',c.series],
      ['分類',(c.category||[]).join('、')]].filter(r=>r[1]);
    const kv=rows.map(r=>`<b>${r[0]}</b><span>${esc(r[1])}</span>`).join('');
    const tags=(c.keywords||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('');
    const note=[c.confidence==='low'?'⚠ 此筆資料信心較低,可能需人工確認。':'',
      c.notes?('📝 '+esc(c.notes)):''].filter(Boolean).join('<br>');
    return `<h2>${esc(c.name_zh||c.name_en||c.id)}</h2>
    <div class="kv">${kv}</div>${tags?`<div class="tags">${tags}</div>`:''}
    ${note?`<div class="note">${note}</div>`:''}`;
  },
  search:c=>[c.number,c.name_zh,c.name_en,c.name_ja,c.series,c.id,c.ip,c.category,c.keywords],
  chips:{values:c=>c.category,top:14},
  modes:[
    {id:'ip',label:'依 IP 分類',key:c=>ACC(c)?'__ACC':(c.ip||''),sort:byNum,
      order:()=>GROUP_ORDER,groupLabel:k=>k===''?'一般車輛 / 其他':groupLabel(k)},
    {id:'size',label:'依大小分類',key:c=>ACC(c)?'__ACC':(c.size||'其他'),
      sort:(a,b)=>{const ia=IP_RANK[a.ip||'']??999,ib=IP_RANK[b.ip||'']??999;return ia!==ib?ia-ib:byNum(a,b);},
      order:()=>SIZE_ORDER.concat(['','__ACC']),groupLabel:k=>k==='__ACC'?groupLabel(k):(SIZE_LABEL[k]||k)}
  ],
  onLoad:(d,cars)=>{
    // 分組順序:IP 依台數多到少,再來一般車輛,車庫/套組最後
    const gc={};cars.forEach(c=>{const k=ACC(c)?'__ACC':(c.ip||'');gc[k]=(gc[k]||0)+1});
    GROUP_ORDER=Object.keys(gc).filter(k=>k&&k!=='__ACC').sort((a,b)=>gc[b]-gc[a]);
    GROUP_ORDER.push('');if(gc['__ACC'])GROUP_ORDER.push('__ACC');
    IP_RANK={};GROUP_ORDER.forEach((k,i)=>IP_RANK[k]=i);
  },
  summary:(d,cars)=>{
    const nCar=cars.filter(c=>!c.kind).length, withImg=cars.filter(c=>c.main_image).length;
    const sz={};cars.forEach(c=>{if(c.kind)return;sz[c.size]=(sz[c.size]||0)+1});
    const szTxt=['標準','長型','口袋'].filter(k=>sz[k]).map(k=>`${k} ${sz[k]}`).join(' / ');
    return `收藏 ${nCar} 台車(${szTxt})· ${withImg} 筆有圖 · 更新 ${d.updated}`;
  },
  count:(list,cars)=>`顯示 ${list.length} 筆 · 收藏共 ${cars.filter(c=>!c.kind).length} 台車`,
  loadError:'載入 cars.json 失敗:'
});
})();
</script>
</body>
</html>
