<style>

function render(gridId, data, isSoda) {
  const grid = document.getElementById(gridId);
  data.forEach((it, i) => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `
      <div class="photo">
        ${pagesHtml(it)}
        <div class="num">${i+1}</div>
        <div class="conf">信心 ${it.conf}</div>
      </div>
      <div class="body">
        <div class="name">${it.name}</div>
        <div class="jp">${it.jp}</div>
        <div class="row"><span class="pill loc">📍 ${it.loc}</span><span class="pill">🗓 ${it.year}</span></div>
        <div class="note">${it.note}</div>
      </div>`;
    grid.appendChild(c);
    bindPages(c);
    c.addEventListener("click", e => {
      if (e.target.closest("button")) return;
      const pg = c.querySelector(".pages");
      openLb(it, Math.round(pg.scrollLeft / pg.clientWidth));
    });
  });
}
// 第一頁官方商品圖、第二頁自己拍的
function pagesHtml(it) {
  const ps = [];
  if (it.box) ps.push({src: "img/box/" + it.box, label: "官方圖", cls: "box"});
  if (it.img) ps.push({src: "img/" + it.img, label: it.imgLabel || "我拍的", cls: it.imgLabel ? "box" : "mine"});
  const pages = ps.map(p => `<div class="page ${p.cls}"><img src="${p.src}" alt="${it.name}" loading="lazy">` +
    (ps.length > 1 ? `<span class="plabel ${p.cls === "mine" ? "mine" : ""}">${p.label}</span>` : "") + `</div>`).join("");
  if (ps.length < 2) return `<div class="pages">${pages}</div>`;
  return `<div class="pages">${pages}</div>
        <button class="nav prev" aria-label="上一張">‹</button><button class="nav next" aria-label="下一張">›</button>
        <div class="dots">${ps.map((_, j) => `<button class="dot${j ? "" : " on"}" aria-label="第 ${j+1} 張"></button>`).join("")}</div>`;
}
function bindPages(card) {
  const pages = card.querySelector(".pages"), dots = card.querySelectorAll(".dot");
  if (!dots.length) return;
  const go = j => pages.scrollTo({left: j * pages.clientWidth, behavior: "smooth"});
  const cur = () => Math.round(pages.scrollLeft / pages.clientWidth);
  dots.forEach((d, j) => d.addEventListener("click", () => go(j)));

  card.querySelector(".next").addEventListener("click", () => go(Math.min(dots.length - 1, cur() + 1)));

  lb.classList.add("on");
