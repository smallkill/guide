  .pill{background:var(--pill);color:var(--accent);border-color:var(--pill-border)}
  .pill.loc{background:rgba(76,194,255,.12);color:var(--accent2);border-color:rgba(76,194,255,.35)}
  .pcf.high{color:var(--ok);border-color:var(--ok)}
  .dnja{font-size:13px;color:var(--dim)}
  .desc{margin-top:10px;font-size:13px;line-height:1.65;color:var(--muted)}
  footer{text-align:center;margin:0 16px 40px;color:var(--dim);font-size:12px}

const photosOf=c=>[c.box&&'img/box/'+c.box,c.img&&'img/'+c.img].filter(Boolean);
CatalogViewer.init({
  load:()=>({items:ALL}),
  imgBase:'',
  emptyIcon:'⚡',
  photos:photosOf,
  mainImage:c=>photosOf(c)[0],

  name:c=>c.name,
  photo:{
    code:c=>String(c.n),
    conf:c=>[c.conf==='高'?'high':'', '信心 '+c.conf],
    sub:c=>c.jp,
    pills:c=>[{t:'📍 '+c.loc,cls:'loc'},'🗓 '+c.year],
