  table { border-collapse: collapse; width: 100%; font-size: .84rem; margin: .6rem 0 .9rem; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: .5rem .7rem; text-align: left; white-space: nowrap; }
  th { color: var(--text-dim); background: var(--bg-code); position: sticky; top: 0; cursor: pointer; user-select: none; }
  th:hover { color: var(--accent); }

  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .held-badge {

  .gap-cell { font-weight: 700; border-radius: 6px; text-align: center !important; }

  footer { margin-top: 2.5rem; color: var(--text-dim); font-size: .78rem; }
  footer a { color: var(--accent); text-decoration: none; }

function gapColor(gap) {
  // gap is negative (distance below buy price) or positive (already past buy price).
  // Closer to 0 (or positive) => brighter accent-green highlight. Farther (more negative) => dim/gray.
  const clamped = Math.max(-30, Math.min(5, gap));
  const t = (clamped + 30) / 35; // 0 (far) .. 1 (near/at buy)
  const bgAlpha = 0.06 + t * 0.28;
  const textLight = 55 + t * 35; // lightness %
  return {
    bg: `rgba(126,231,135,${bgAlpha.toFixed(3)})`,
    border: `1px solid rgba(126,231,135,${(0.15 + t * 0.35).toFixed(3)})`,
    color: t > 0.3 ? `hsl(112, 55%, ${textLight}%)` : 'var(--text-dim)'
  };
}

function fmt(n) {
  return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

let sortKey = 'gap', sortDir = 1; // 1 = ascending (most negative/lowest gap first... we'll default to nearest-to-buy first)
let currentFilter = 'all';

function render() {
  let rows = DATA.rows.filter(r => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'held') return r.held;
    return r.market === currentFilter;
  });

  rows = rows.slice().sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => {
    const gc = gapColor(r.gap);
    return `<tr>
      <td>${r.sym}</td>
      <td>${r.name}</td>
      <td><span class="market-badge">${r.market}</span></td>
      <td class="num">${fmt(r.cur)}</td>
      <td class="num">${fmt(r.buy)}</td>
      <td class="num gap-cell" style="background:${gc.bg};border:${gc.border};color:${gc.color}">${r.gap > 0 ? '+' : ''}${r.gap.toFixed(1)}%</td>
      <td>${r.held ? '<span class="held-badge">★ 持有</span>' : ''}</td>
      <td class="theme-cell">${r.theme || '—'}</td>
    </tr>`;
  }).join('');
}

function renderStats() {
  const rows = DATA.rows;
  const total = rows.length;
  const held = rows.filter(r => r.held).length;
  const near = rows.filter(r => r.gap > -8).sort((a, b) => b.gap - a.gap);
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-held').textContent = held;
  document.getElementById('stat-near').textContent = near.length;
  document.getElementById('updated-line').textContent = '更新日期：' + DATA.updated;
  if (near.length) {
    document.getElementById('near-list').style.display = 'block';
    document.getElementById('near-chips').innerHTML = near.map(r =>
      `<span class="chip">${r.sym} ${r.gap > 0 ? '+' : ''}${r.gap.toFixed(1)}%${r.held ? ' ★' : ''}</span>`
    ).join('');
  }
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.market;
  render();
});

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('th .arrow').forEach(a => a.textContent = '');
    th.querySelector('.arrow').textContent = sortDir === 1 ? '▴' : '▾';
    render();
  });
});

renderStats();
render();
</script>
</body>
</html>
